# Korean LLM Fine-tuning Configuration

# 모델 설정
model:
  base_model: "Qwen/Qwen2.5-3B"  # 또는 "meta-llama/Llama-3.2-3B"
  trust_remote_code: true

# LoRA 하이퍼파라미터
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  bias: "none"
  task_type: "CAUSAL_LM"

# 양자화 설정 (4bit)
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# 학습 설정
training:
  output_dir: "./outputs"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 512
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  fp16: true
  optim: "paged_adamw_32bit"
  gradient_checkpointing: true
  report_to: "none"  # "wandb" for weights & biases logging

# 데이터 설정
data:
  train_file: "./data/sample_instructions.jsonl"
  # huggingface_dataset: "beomi/KoAlpaca-v1.1a"  # HuggingFace 데이터셋 사용시
  validation_split: 0.1
  seed: 42

# 프롬프트 템플릿 (Alpaca 스타일)
prompt:
  template: |
    ### 질문:
    {instruction}

    ### 답변:
    {output}

  inference_template: |
    ### 질문:
    {instruction}

    ### 답변:
