version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: benchmark-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
      --served-model-name default
      --host 0.0.0.0
      --port 8001
      --gpu-memory-utilization 0.45
      --max-model-len 2048
      --trust-remote-code
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  tgi:
    image: ghcr.io/huggingface/text-generation-inference:latest
    container_name: benchmark-tgi
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - ~/.cache/huggingface:/data
    command: >
      --model-id ${MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
      --port 8002
      --max-input-length 1024
      --max-total-tokens 2048
      --trust-remote-code
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

networks:
  default:
    driver: bridge
